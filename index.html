<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-Slot Telegram Game</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 { color: #f59e0b; margin-bottom: 5px; font-size: 24px; }
        .balance-box {
            font-size: 20px;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #f59e0b;
        }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            border: 3px solid #f59e0b;
        }
        .slot {
            width: 70px;
            height: 80px;
            background-color: #0f172a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid #334155;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .spin-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .buy-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
        }
    </style>
</head>
<body>

    <h1>🎰 Mega 9-Slots 🎰</h1>

    <div class="balance-box">
        Մնացորդ: <span id="balance" style="color: #f59e0b;">100</span> 🪙
    </div>

    <div class="slots-grid">
        <div class="slot" id="s1">🍒</div>
        <div class="slot" id="s2">🍋</div>
        <div class="slot" id="s3">🍇</div>
        <div class="slot" id="s4">🍉</div>
        <div class="slot" id="s5">7️⃣</div>
        <div class="slot" id="s6">💎</div>
        <div class="slot" id="s7">🔔</div>
        <div class="slot" id="s8">👑</div>
        <div class="slot" id="s9">🍀</div>
    </div>

    <div id="message"></div>

    <div class="controls">
        <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN (-20 🪙)</button>
        <button class="buy-btn" onclick="buyCoins()">+ Գնել 🪙</button>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '🍉', '7️⃣', '💎', '🔔', '👑', '🍀'];
        let balance = 100;
        const spinCost = 20;

        function spin() {
            const message = document.getElementById('message');
            if (balance < spinCost) {
                message.style.color = '#ef4444';
                message.innerText = '❌ Միավորները չեն հերիքում:';
                return;
            }

            balance -= spinCost;
            document.getElementById('balance').innerText = balance;
            message.innerText = '';

            let count = 0;
            const interval = setInterval(() => {
                for (let i = 1; i <= 9; i++) {
                    document.getElementById('s' + i).innerText = symbols[Math.floor(Math.random() * symbols.length)];
                }
                count++;
                if (count > 10) {
                    clearInterval(interval);
                }
            }, 80);
        }

        function buyCoins() {
            alert("Գնման համակարգը կմիացվի սերվերի հետ:");
        }
    </script>

</body>
</html>
