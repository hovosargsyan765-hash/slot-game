<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning Hot PRO - Adjarabet Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #051c09;
            --panel-bg: #0b2e12;
            --gold: #f3c653;
            --gold-light: #ffea9f;
            --accent-red: #c62828;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f4019 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .balance-box, .win-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 9px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .value {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Prominent Top-Up Button */
        .top-up-btn {
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(255, 153, 0, 0.6);
            transition: transform 0.1s;
        }

        .top-up-btn:active {
            transform: scale(0.92);
        }

        /* Slot Machine Area */
        .slot-container {
            position: relative;
            background: linear-gradient(180deg, #0d3815 0%, #030d05 100%);
            border: 4px solid var(--gold);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 0 30px rgba(243, 198, 83, 0.4), inset 0 0 20px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 360px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .reel-cell {
            background: radial-gradient(circle, #ffffff 0%, #dcdcdc 100%);
            border: 2px solid #b8860b;
            border-radius: 10px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .reel-cell.winning {
            background: radial-gradient(circle, #ffffa3 0%, #ffcc00 100%);
            border-color: #ff3300;
            animation: pulseWin 0.4s infinite alternate;
        }

        @keyframes pulseWin {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        /* Controls Panel */
        .controls-panel {
            width: 100%;
            max-width: 360px;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .bets-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .bet-btn {
            flex: 1;
            background: #113f1b;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 10px var(--gold);
        }

        /* Round Spin/Stop Button */
        .action-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spin-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff3333, #880000);
            border: 4px solid var(--gold);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
            outline: none;
        }

        .spin-btn:active {
            transform: scale(0.92);
        }

        .spin-btn.stop-state {
            background: linear-gradient(145deg, #ff9900, #b35900);
        }

        /* Modal TopUp */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 0 25px rgba(243, 198, 83, 0.5);
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 16px;
        }

        .star-option {
            background: #113f1b;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .star-option:hover {
            background: var(--gold);
            color: #000;
        }

        .close-modal {
            margin-top: 12px;
            background: #555;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <span class="label">ԲԱԼԱՆՍ</span>
            <span class="value" id="balanceVal">1000 ֏</span>
        </div>
        <div class="win-box">
            <span class="label">ՇԱՀՈՒՄ</span>
            <span class="value" id="winVal">0 ֏</span>
        </div>
        <button class="top-up-btn" onclick="openModal()">⭐ STARS</button>
    </header>

    <div class="slot-container">
        <div class="grid-3x3" id="slotGrid">
            <div class="reel-cell">🍒</div>
            <div class="reel-cell">🍋</div>
            <div class="reel-cell">👑</div>
            <div class="reel-cell">🍉</div>
            <div class="reel-cell">⭐</div>
            <div class="reel-cell">🍇</div>
            <div class="reel-cell">🔔</div>
            <div class="reel-cell">🍊</div>
            <div class="reel-cell">👑</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="bets-row" id="betsRow">
            <button class="bet-btn active" onclick="setBet(10)">10</button>
            <button class="bet-btn" onclick="setBet(20)">20</button>
            <button class="bet-btn" onclick="setBet(30)">30</button>
            <button class="bet-btn" onclick="setBet(40)">40</button>
            <button class="bet-btn" onclick="setBet(50)">50</button>
        </div>
        <div class="action-row">
            <button class="spin-btn" id="spinBtn" onclick="handleSpinAction()">ՊՏՏԵԼ</button>
        </div>
    </div>

    <!-- Modal for Telegram Stars TopUp -->
    <div class="modal" id="topUpModal">
        <div class="modal-content">
            <h3>ՀԱՇՎԵԿՇՌԻ ՀԱՄԱԼՐՈՒՄ</h3>
            <p style="font-size: 11px; margin-bottom: 12px; color: #ddd;">Ընտրեք Telegram Stars փաթեթը</p>
            <button class="star-option" onclick="topUp(500, 50)">⭐ 50 Stars (+500 ֏)</button>
            <button class="star-option" onclick="topUp(1200, 100)">⭐ 100 Stars (+1200 ֏)</button>
            <button class="star-option" onclick="topUp(3000, 250)">⭐ 250 Stars (+3000 ֏)</button>
            <button class="close-modal" onclick="closeModal()">Փակել</button>
        </div>
    </div>

    <script>
        // Burning Hot proper symbols: Crown (Wild), Star (Scatter), Bell, Watermelon, Grapes, Orange, Lemon, Cherry
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🍉', '🔔', '⭐', '👑'];
        const weights = [30, 25, 20, 15, 8, 5, 3, 2];

        let balance = 1000;
        let currentBet = 10;
        let currentWin = 0;
        let isSpinning = false;
        let spinInterval = null;

        // Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } else if (type === 'spinTick') {
                osc.frequency.setValueAtTime(250 + Math.random() * 150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } else if (type === 'win') {
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(783.99, now + 0.24);
                osc.frequency.setValueAtTime(1046.50, now + 0.36);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            }
        }

        function getRandomSymbol() {
            let totalWeight = weights.reduce((a, b) => a + b, 0);
            let randomNum = Math.random() * totalWeight;
            for (let i = 0; i < symbols.length; i++) {
                if (randomNum < weights[i]) return symbols[i];
                randomNum -= weights[i];
            }
            return symbols[0];
        }

        function setBet(amount) {
            if (isSpinning) return;
            playSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === amount);
            });
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance + ' ֏';
            document.getElementById('winVal').innerText = currentWin + ' ֏';
        }

        function handleSpinAction() {
            playSound('click');
            const spinBtn = document.getElementById('spinBtn');

            if (!isSpinning) {
                if (balance < currentBet) {
                    alert('Բալանսը բավարար չէ։ Սեղմեք ⭐ STARS կոճակը հաշիվը համալրելու համար։');
                    return;
                }

                balance -= currentBet;
                currentWin = 0;
                updateUI();
                clearWinningCells();

                isSpinning = true;
                spinBtn.innerText = 'ԿԱՆԳՆԵԼ';
                spinBtn.classList.add('stop-state');

                const cells = document.querySelectorAll('.reel-cell');
                spinInterval = setInterval(() => {
                    cells.forEach(cell => {
                        cell.innerText = getRandomSymbol();
                        playSound('spinTick');
                    });
                }, 80);

            } else {
                stopSpinAndEvaluate();
            }
        }

        function stopSpinAndEvaluate() {
            if (!isSpinning) return;
            clearInterval(spinInterval);
            isSpinning = false;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = 'ՊՏՏԵԼ';
            spinBtn.classList.remove('stop-state');

            const cells = document.querySelectorAll('.reel-cell');
            let matrix = [];
            cells.forEach(cell => {
                let sym = getRandomSymbol();
                cell.innerText = sym;
                matrix.push(sym);
            });

            let winAmount = 0;
            let winningIndices = [];

            // Check middle row (Index 3, 4, 5) with Crown Wild support
            let m1 = matrix[3], m2 = matrix[4], m3 = matrix[5];
            if ((m1 === m2 && m2 === m3) || m1 === '👑' || m2 === '👑' || m3 === '👑') {
                winAmount += currentBet * 5 * 2; // 2x middle row multiplier
                winningIndices.push(3, 4, 5);
            }

            // Check full field (all matching or crowns) -> 5x multiplier bonus
            let allMatch = matrix.every(s => s === matrix[0] || s === '👑');
            if (allMatch) {
                winAmount += currentBet * 25 * 5;
                winningIndices = [0,1,2,3,4,5,6,7,8];
            } else {
                // Top row
                if (matrix[0] === matrix[1] && matrix[1] === matrix[2]) {
                    winAmount += currentBet * 3;
                    winningIndices.push(0, 1, 2);
                }
                // Bottom row
                if (matrix[6] === matrix[7] && matrix[7] === matrix[8]) {
                    winAmount += currentBet * 3;
                    winningIndices.push(6, 7, 8);
                }
            }

            if (winAmount > 0) {
                currentWin = winAmount;
                balance += winAmount;
                playSound('win');
                winningIndices.forEach(idx => {
                    cells[idx].classList.add('winning');
                });
            }

            updateUI();
        }

        function clearWinningCells() {
            document.querySelectorAll('.reel-cell').forEach(cell => {
                cell.classList.remove('winning');
            });
        }

        function openModal() {
            playSound('click');
            document.getElementById('topUpModal').style.display = 'flex';
        }

        function closeModal() {
            playSound('click');
            document.getElementById('topUpModal').style.display = 'none';
        }

        function topUp(amount, stars) {
            playSound('win');
            balance += amount;
            updateUI();
            closeModal();
            alert(`Հաջողությամբ համալրվեց +${amount} ֏ (${stars} Stars)!`);
        }

        updateUI();
    </script>
</body>
</html>
