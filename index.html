<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shining Crown PRO 👑</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle, #400 0%, #1a0000 70%, #000 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: 10px;
        }
        .header-top {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 450px;
        }
        .jackpot-box {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 2px solid #ffd700;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            box-shadow: 0 0 12px rgba(255,215,0,0.4);
        }
        .jp-title { font-size: 8px; color: #ffeb3b; font-weight: bold; }
        .jp-val { font-size: 10px; color: #fff; font-weight: bold; }

        .main-container {
            background: linear-gradient(180deg, #600, #200);
            border: 4px solid #ffd700;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 0 30px rgba(255,215,0,0.6);
            width: 100%;
            max-width: 450px;
        }
        .slot-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px #ff0, 0 0 20px #f00;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #0a0a0a;
            padding: 8px;
            border-radius: 10px;
            border: 2px inset #444;
        }
        .reel {
            background: linear-gradient(to bottom, #ffffff, #e0e0e0, #ffffff);
            height: 80px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
            border: 2px solid #b8860b;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #555;
        }
        .panel-block { text-align: center; }
        .panel-label { font-size: 9px; color: #aaa; text-transform: uppercase; }
        .panel-value { font-size: 13px; font-weight: bold; color: #00ffcc; }
        
        .bets-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 450px;
            margin-top: 6px;
        }
        .bet-btn {
            background: linear-gradient(to bottom, #333, #111);
            border: 2px solid #555;
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .bet-btn.active {
            background: linear-gradient(to bottom, #2e7d32, #1b5e20);
            border-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
            color: #ffeb3b;
        }

        .controls-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
            margin-top: 6px;
        }
        .spin-btn {
            background: radial-gradient(circle, #ff9800, #e65100);
            border: 3px solid #ffd700;
            color: white;
            font-size: 18px;
            font-weight: bold;
            width: 130px;
            height: 48px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,152,0,0.8);
            text-transform: uppercase;
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; filter: grayscale(50%); }

        .stars-btn {
            background: linear-gradient(to bottom, #00b0ff, #002884);
            border: 2px solid #40c4ff;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,176,255,0.5);
        }
        .msg-alert {
            font-size: 12px;
            color: #ff5252;
            font-weight: bold;
            height: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="jackpot-box"><div class="jp-title">♠ SPADES</div><div class="jp-val">52,787</div></div>
        <div class="jackpot-box"><div class="jp-title">♥ HEARTS</div><div class="jp-val">3,351</div></div>
        <div class="jackpot-box"><div class="jp-title">♦ DIAMOND</div><div class="jp-val">37,597</div></div>
        <div class="jackpot-box"><div class="jp-title">♣ CLUBS</div><div class="jp-val">48,594</div></div>
    </div>

    <div class="main-container">
        <div class="slot-title">👑 SHINING CROWN PRO 👑</div>
        <div class="slots-grid">
            <div class="reel" id="r0">🍒</div>
            <div class="reel" id="r1">🍋</div>
            <div class="reel" id="r2">🍊</div>
            <div class="reel" id="r3">🍇</div>
            <div class="reel" id="r4">👑</div>
            <div class="reel" id="r5">🔔</div>
            <div class="reel" id="r6">🍉</div>
            <div class="reel" id="r7">🍇</div>
            <div class="reel" id="r8">🍒</div>
        </div>
        <div class="info-panel">
            <div class="panel-block">
                <div class="panel-label">Balance</div>
                <div class="panel-value" id="balance-val">150 AMD</div>
            </div>
            <div class="msg-alert" id="msg-alert"></div>
            <div class="panel-block">
                <div class="panel-label">Last Win</div>
                <div class="panel-value" id="win-val">0 AMD</div>
            </div>
        </div>
    </div>

    <div class="bets-container">
        <button class="bet-btn active" onclick="setBet(10)">10</button>
        <button class="bet-btn" onclick="setBet(20)">20</button>
        <button class="bet-btn" onclick="setBet(30)">30</button>
        <button class="bet-btn" onclick="setBet(40)">40</button>
        <button class="bet-btn" onclick="setBet(50)">50</button>
    </div>

    <div class="controls-container">
        <button class="stars-btn" onclick="buyStars()">⭐ Buy Stars</button>
        <button class="spin-btn" id="spin-btn" onclick="startSpin()">SPIN</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 150;
        let currentBet = 10;
        let isSpinning = false;
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🍉', '🔔', '👑', '⭐'];

        function setBet(amount) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText == amount);
            });
            playClickSound();
        }

        function updateUI() {
            document.getElementById('balance-val').innerText = balance + ' AMD';
        }

        function buyStars() {
            playClickSound();
            // Simulation of Telegram Stars top-up (Adds +200 credits)
            balance += 200;
            updateUI();
            showAlert("⭐ +200 Stars Added Successfully!");
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function showAlert(text) {
            const alertEl = document.getElementById('msg-alert');
            alertEl.innerText = text;
            setTimeout(() => { alertEl.innerText = ""; }, 2500);
        }

        function startSpin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                showAlert("INSUFFICIENT BALANCE!");
                return;
            }

            balance -= currentBet;
            updateUI();
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('win-val').innerText = "0 AMD";
            playSpinSound();

            let interval = setInterval(() => {
                for (let i = 0; i < 9; i++) {
                    document.getElementById('r' + i).innerText = symbols[Math.floor(Math.random() * symbols.length)];
                }
            }, 70);

            setTimeout(() => {
                clearInterval(interval);
                
                let finalRes = [];
                for (let i = 0; i < 9; i++) {
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    document.getElementById('r' + i).innerText = sym;
                    finalRes.push(sym);
                }

                let winAmount = 0;
                // Check middle line win
                if (finalRes[3] === finalRes[4] && finalRes[4] === finalRes[5]) {
                    winAmount = currentBet * 8;
                }

                if (winAmount > 0) {
                    balance += winAmount;
                    document.getElementById('win-val').innerText = winAmount + ' AMD';
                    showAlert("WIN: " + winAmount + " AMD! 🎉");
                    playWinSound();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }

                updateUI();
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
            }, 1400);
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playClickSound() {
            initAudio();
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSpinSound() {
            initAudio();
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(350, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }

        function playWinSound() {
            initAudio();
            if(!audioCtx) return;
            let now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(freq, now + index * 0.08);
                gain.gain.setValueAtTime(0.25, now + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.08 + 0.3);
                osc.start(now + index * 0.08);
                osc.stop(now + index * 0.08 + 0.3);
            });
        }
    </script>
</body>
</html>
