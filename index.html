<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning Hot - PRO v103</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #072a0e;
            --panel-bg: #051808;
            --gold: #f4c430;
            --gold-light: #ffea9f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 4px;
            overflow: hidden;
        }

        .jackpot-panel {
            width: 100%;
            max-width: 360px;
            background: #0c2d12;
            border: 2px solid var(--gold);
            border-radius: 6px;
            padding: 3px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            text-align: center;
        }

        .jp-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #c5a059;
            border-radius: 3px;
            padding: 2px;
        }

        .jp-title { font-size: 7px; font-weight: bold; }
        .jp-val { font-size: 9px; color: var(--gold-light); font-weight: bold; }

        header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 6px;
            padding: 5px 8px;
            gap: 4px;
        }

        .balance-box, .win-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label { font-size: 6px; color: var(--gold); font-weight: bold; }
        .value { font-size: 11px; font-weight: bold; color: var(--text-color); }

        .top-up-btn, .cashout-btn {
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 5px 7px;
            font-size: 8px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        .cashout-btn {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: #fff;
        }

        .slot-container {
            background: #010602;
            border: 3px solid var(--gold);
            border-radius: 8px;
            padding: 5px;
            width: 100%;
            max-width: 360px;
        }

        .grid-5x3 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .reel-cell {
            background: #ffffff;
            border: 2px solid #b8860b;
            border-radius: 5px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Առանձին ոճ 7-նյակի համար (կապույտ ֆոնով, սպիտակ փայլուն տեքստով) */
        .reel-cell.seven-symbol {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 0 5px #00d2ff, 0 0 10px #00d2ff;
            border-color: #00d2ff;
        }

        .reel-cell.winning {
            background: #ffcc00 !important;
            color: #000 !important;
            border-color: #ff0000;
            text-shadow: none;
            transform: scale(1.05);
            transition: 0.2s;
        }

        .controls-panel {
            width: 100%;
            max-width: 360px;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bets-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .bet-btn {
            background: #051808;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 0;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
        }

        .spin-btn {
            width: 100%;
            height: 38px;
            border-radius: 19px;
            background: linear-gradient(145deg, #d32f2f, #8b0000);
            border: 2px solid var(--gold);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .spin-btn.stop-mode {
            background: linear-gradient(145deg, #ff8c00, #ff4500);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            width: 85%;
            max-width: 270px;
        }

        .modal-content h3 { color: var(--gold); margin-bottom: 6px; font-size: 12px; }
        .modal-content p { font-size: 8px; color: #ccc; margin-bottom: 6px; }

        .option-input {
            width: 100%;
            padding: 6px;
            background: #010602;
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 5px;
            outline: none;
        }

        .option-btn {
            background: #051808;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 6px;
            margin: 2px 0;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
        }

        .option-btn:hover {
            background: var(--gold);
            color: #000;
        }

        .close-modal {
            margin-top: 5px;
            background: #444;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
        }
    </style>
</head>
<body>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>

    <div class="jackpot-panel">
        <div class="jp-box"><div class="jp-title" style="color: #ff5252;">SPADE</div><div class="jp-val" id="jpSpade">19,400 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #ff8a80;">HEART</div><div class="jp-val" id="jpHeart">13,200 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #40c4ff;">DIAM</div><div class="jp-val" id="jpDiamond">9,100 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #69f0ae;">CLUB</div><div class="jp-val" id="jpClub">5,000 ֏</div></div>
    </div>

    <header>
        <div class="balance-box">
            <span class="label">ԲԱԼԱՆՍ</span>
            <span class="value" id="balanceVal">1000 ֏</span>
        </div>
        <div class="win-box">
            <span class="label">ՇԱՀՈՒՄ</span>
            <span class="value" id="winVal">0 ֏</span>
        </div>
        <button class="top-up-btn" onclick="openModal('topUpModal')">ԴԵՊՈԶԻՏ</button>
        <button class="cashout-btn" onclick="openModal('cashoutModal')">ՀԱՆԵԼ</button>
    </header>

    <div class="slot-container">
        <div class="grid-5x3" id="slotGrid">
            <div class="reel-cell" data-index="0">🍇</div>
            <div class="reel-cell" data-index="1">☘️</div>
            <div class="reel-cell" data-index="2">🍊</div>
            <div class="reel-cell" data-index="3">🔔</div>
            <div class="reel-cell seven-symbol" data-index="4">7</div>

            <div class="reel-cell" data-index="5">🍉</div>
            <div class="reel-cell" data-index="6">☘️</div>
            <div class="reel-cell" data-index="7">🍊</div>
            <div class="reel-cell" data-index="8">🍉</div>
            <div class="reel-cell" data-index="9">🍇</div>

            <div class="reel-cell" data-index="10">🍇</div>
            <div class="reel-cell" data-index="11">☘️</div>
            <div class="reel-cell seven-symbol" data-index="12">7</div>
            <div class="reel-cell" data-index="13">🍑</div>
            <div class="reel-cell" data-index="14">🔔</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="bets-row">
            <button class="bet-btn active" onclick="setBet(20, this)">20 ֏</button>
            <button class="bet-btn" onclick="setBet(40, this)">40 ֏</button>
            <button class="bet-btn" onclick="setBet(60, this)">60 ֏</button>
            <button class="bet-btn" onclick="setBet(80, this)">80 ֏</button>
            <button class="bet-btn" onclick="setBet(100, this)">100 ֏</button>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="handleSpinButton()">ՊՏՏԵԼ</button>
    </div>

    <!-- Դեպոզիտի Մոդալ -->
    <div class="modal" id="topUpModal">
        <div class="modal-content">
            <h3>ԴԵՊՈԶԻՏ (Նվազ. 100 ֏)</h3>
            <p>Մուտքագրեք կամ ընտրեք գումարը</p>
            <input type="number" id="topUpInput" class="option-input" value="1000" min="100" />
            <button class="option-btn" onclick="customTopUp()">Համալրել նշվածը</button>
            <button class="option-btn" onclick="topUpQuick(500)">+ 500 ֏</button>
            <button class="option-btn" onclick="topUpQuick(1000)">+ 1,000 ֏</button>
            <button class="close-modal" onclick="closeModal('topUpModal')">Փակել</button>
        </div>
    </div>

    <!-- Կանխիկացման Մոդալ -->
    <div class="modal" id="cashoutModal">
        <div class="modal-content">
            <h3>ԿԱՆԽԻԿԱՑՈՒՄ (Նվազ. 500 ֏)</h3>
            <p>Մուտքագրեք հանվող գումարը</p>
            <input type="number" id="cashoutInput" class="option-input" value="500" min="500" />
            <button class="option-btn" onclick="customCashout()">Հանել նշված գումարը</button>
            <button class="option-btn" onclick="cashoutAll()">Հանել ԱՄԲՈՂՋԸ</button>
            <button class="close-modal" onclick="closeModal('cashoutModal')">Փակել</button>
        </div>
    </div>

    <script>
        const symbols = ['🍇', '🍉', '🍊', '🍑', '🍋', '🔔', '7', '☘️'];
        let balance = 1000;
        let currentBet = 20;
        let currentWin = 0;
        let isSpinning = false;
        let spinInterval = null;
        let spinTimeout = null;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'spinTick') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + Math.random() * 100, now);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                } else if (type === 'win') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15);
                    osc.frequency.setValueAtTime(783.99, now + 0.3);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance + ' ֏';
            document.getElementById('winVal').innerText = currentWin + ' ֏';
        }

        function setBet(amount, btn) {
            if (isSpinning) return;
            playSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleSpinButton() {
            if (!isSpinning) {
                startSpin();
            } else {
                stopSpinImmediately();
            }
        }

        function startSpin() {
            initAudio();
            if (balance < currentBet) {
                alert('Բալանսը բավարար չէ խաղադրույքի համար։');
                return;
            }

            playSound('click');
            balance -= currentBet;
            currentWin = 0;
            updateUI();
            
            document.querySelectorAll('.reel-cell').forEach(c => {
                c.classList.remove('winning', 'seven-symbol');
            });

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = '🛑 ԿԱՆԳՆԵՑՆԵԼ';
            spinBtn.classList.add('stop-mode');

            let cells = document.querySelectorAll('.reel-cell');
            
            spinInterval = setInterval(() => {
                cells.forEach(c => {
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    c.innerText = sym;
                    if (sym === '7') {
                        c.classList.add('seven-symbol');
                    } else {
                        c.classList.remove('seven-symbol');
                    }
                    playSound('spinTick');
                });
            }, 70);

            spinTimeout = setTimeout(() => {
                if (isSpinning) finishSpin();
            }, 3000);
        }

        function stopSpinImmediately() {
            if (!isSpinning) return;
            clearTimeout(spinTimeout);
            finishSpin();
        }

        function finishSpin() {
            clearInterval(spinInterval);
            isSpinning = false;

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = 'ՊՏՏԵԼ';
            spinBtn.classList.remove('stop-mode');

            let cells = document.querySelectorAll('.reel-cell');
            let grid = [];
            for(let i=0; i<3; i++) {
                grid[i] = [];
                for(let j=0; j<5; j++) {
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    let idx = i * 5 + j;
                    cells[idx].innerText = sym;
                    
                    if (sym === '7') {
                        cells[idx].classList.add('seven-symbol');
                    } else {
                        cells[idx].classList.remove('seven-symbol');
                    }

                    grid[i][j] = { sym: sym, index: idx };
                }
            }

            let winningIndices = new Set();
            let totalWinMultiplier = 0;

            for(let i=0; i<3; i++) {
                let s0 = grid[i][0].sym, s1 = grid[i][1].sym, s2 = grid[i][2].sym;
                let s3 = grid[i][3].sym, s4 = grid[i][4].sym;
                
                if(s0 === s1 && s1 === s2) {
                    let count = (s0 === s3) ? ((s0 === s4) ? 5 : 4) : 3;
                    let mult = (s0 === '7') ? 20 : 10;
                    totalWinMultiplier += mult * (count - 2);
                    for(let c=0; c<count; c++) winningIndices.add(grid[i][c].index);
                }
            }

            if(totalWinMultiplier > 0) {
                currentWin = currentBet * totalWinMultiplier;
                balance += currentWin;
                winningIndices.forEach(idx => {
                    cells[idx].classList.remove('seven-symbol');
                    cells[idx].classList.add('winning');
                });
                playSound('win');
            }

            updateUI();
        }

        function openModal(id) {
            playSound('click');
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            playSound('click');
            document.getElementById(id).style.display = 'none';
        }

        function topUpQuick(amount) {
            balance += amount;
            updateUI();
            closeModal('topUpModal');
            alert('Հաջողությամբ համալրվեց +' + amount + ' ֏');
        }

        function customTopUp() {
            let val = parseInt(document.getElementById('topUpInput').value);
            if (isNaN(val) || val < 100) {
                alert('Նվազագույն դեպոզիտը 100 ֏ է։');
                return;
            }
            balance += val;
            updateUI();
            closeModal('topUpModal');
            alert('Հաջողությամբ համալրվեց +' + val + ' ֏');
        }

        function customCashout() {
            let val = parseInt(document.getElementById('cashoutInput').value);
            if (isNaN(val) || val < 500) {
                alert('Նվազագույն կանխիկացումը 500 ֏ է։');
                return;
            }
            if (val > balance) {
                alert('Բալանսում այսքան գումար չկա։');
                return;
            }
            balance -= val;
            updateUI();
            closeModal('cashoutModal');
            alert('Հաջողությամբ կանխիկացվեց ' + val + ' ֏');
        }

        function cashoutAll() {
            if (balance < 500) {
                alert('Կանխիկացման նվազագույն գումարը 500 ֏ է։');
                return;
            }
            let amt = balance;
            balance = 0;
            updateUI();
            closeModal('cashoutModal');
            alert('Հաջողությամբ կանխիկացվեց ամբողջը՝ ' + amt + ' ֏');
        }

        updateUI();
    </script>
</body>
</html>
