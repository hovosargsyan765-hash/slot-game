<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning Hot - PRO v100</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #020d04;
            --panel-bg: #051808;
            --gold: #f4c430;
            --gold-light: #ffea9f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: Arial, sans-serif;
        }

        body {
            background: #072a0e;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            overflow: hidden;
        }

        .jackpot-panel {
            width: 100%;
            max-width: 380px;
            background: #0c2d12;
            border: 2px solid var(--gold);
            border-radius: 6px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            text-align: center;
        }

        .jp-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #c5a059;
            border-radius: 3px;
            padding: 2px;
        }

        .jp-title { font-size: 7px; font-weight: bold; }
        .jp-val { font-size: 9px; color: var(--gold-light); font-weight: bold; }

        header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 6px;
            padding: 6px;
            gap: 4px;
        }

        .balance-box, .win-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label { font-size: 6px; color: var(--gold); font-weight: bold; }
        .value { font-size: 11px; font-weight: bold; color: var(--text-color); }

        .top-up-btn, .cashout-btn {
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 9px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        .cashout-btn {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: #fff;
        }

        .slot-container {
            background: #010602;
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 6px;
            width: 100%;
            max-width: 380px;
        }

        .grid-5x3 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .reel-cell {
            background: #ffffff;
            border: 2px solid #b8860b;
            border-radius: 5px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .reel-cell.winning {
            background: #ffcc00;
            border-color: #ff0000;
        }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bets-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
        }

        .bet-btn {
            background: #051808;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 0;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
        }

        .spin-btn {
            width: 100%;
            height: 42px;
            border-radius: 21px;
            background: linear-gradient(145deg, #d32f2f, #8b0000);
            border: 2px solid var(--gold);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            width: 85%;
            max-width: 280px;
        }

        .modal-content h3 { color: var(--gold); margin-bottom: 8px; font-size: 13px; }
        .modal-content p { font-size: 9px; color: #ccc; margin-bottom: 8px; }

        .option-input {
            width: 100%;
            padding: 7px;
            background: #010602;
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 6px;
            outline: none;
        }

        .option-btn {
            background: #051808;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 7px;
            margin: 3px 0;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .option-btn:hover {
            background: var(--gold);
            color: #000;
        }

        .close-modal {
            margin-top: 6px;
            background: #444;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>

    <div class="jackpot-panel">
        <div class="jp-box"><div class="jp-title" style="color: #ff5252;">SPADE</div><div class="jp-val" id="jpSpade">19,400 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #ff8a80;">HEART</div><div class="jp-val" id="jpHeart">13,200 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #40c4ff;">DIAM</div><div class="jp-val" id="jpDiamond">9,100 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #69f0ae;">CLUB</div><div class="jp-val" id="jpClub">5,000 ֏</div></div>
    </div>

    <header>
        <div class="balance-box">
            <span class="label">ԲԱԼԱՆՍ</span>
            <span class="value" id="balanceVal">1000 ֏</span>
        </div>
        <div class="win-box">
            <span class="label">ՇԱՀՈՒՄ</span>
            <span class="value" id="winVal">0 ֏</span>
        </div>
        <button class="top-up-btn" onclick="openModal('topUpModal')">ԴԵՊՈԶԻՏ</button>
        <button class="cashout-btn" onclick="openModal('cashoutModal')">ՀԱՆԵԼ</button>
    </header>

    <div class="slot-container">
        <div class="grid-5x3" id="slotGrid">
            <div class="reel-cell" data-col="0" data-row="0">🍇</div>
            <div class="reel-cell" data-col="1" data-row="0">☘️</div>
            <div class="reel-cell" data-col="2" data-row="0">🍊</div>
            <div class="reel-cell" data-col="3" data-row="0">🔔</div>
            <div class="reel-cell" data-col="4" data-row="0">7️⃣</div>

            <div class="reel-cell" data-col="0" data-row="1">🍉</div>
            <div class="reel-cell" data-col="1" data-row="1">☘️</div>
            <div class="reel-cell" data-col="2" data-row="1">🍊</div>
            <div class="reel-cell" data-col="3" data-row="1">🍉</div>
            <div class="reel-cell" data-col="4" data-row="1">🍇</div>

            <div class="reel-cell" data-col="0" data-row="2">🍇</div>
            <div class="reel-cell" data-col="1" data-row="2">☘️</div>
            <div class="reel-cell" data-col="2" data-row="2">🍇</div>
            <div class="reel-cell" data-col="3" data-row="2">🍑</div>
            <div class="reel-cell" data-col="4" data-row="2">🔔</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="bets-row">
            <button class="bet-btn active" onclick="setBet(20, this)">20 ֏</button>
            <button class="bet-btn" onclick="setBet(40, this)">40 ֏</button>
            <button class="bet-btn" onclick="setBet(60, this)">60 ֏</button>
            <button class="bet-btn" onclick="setBet(80, this)">80 ֏</button>
            <button class="bet-btn" onclick="setBet(100, this)">100 ֏</button>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">ՊՏՏԵԼ</button>
    </div>

    <!-- Դեպոզիտի Մոդալ -->
    <div class="modal" id="topUpModal">
        <div class="modal-content">
            <h3>ԴԵՊՈԶԻՏ (Նվազ. 100 ֏)</h3>
            <p>Մուտքագրեք կամ ընտրեք գումարը</p>
            <input type="number" id="topUpInput" class="option-input" value="1000" min="100" />
            <button class="option-btn" onclick="customTopUp()">Համալրել նշվածը</button>
            <button class="option-btn" onclick="topUpQuick(500)">+ 500 ֏</button>
            <button class="option-btn" onclick="topUpQuick(1000)">+ 1,000 ֏</button>
            <button class="close-modal" onclick="closeModal('topUpModal')">Փակել</button>
        </div>
    </div>

    <!-- Կանխիկացման Մոդալ -->
    <div class="modal" id="cashoutModal">
        <div class="modal-content">
            <h3>ԿԱՆԽԻԿԱՑՈՒՄ (Նվազ. 500 ֏)</h3>
            <p>Մուտքագրեք հանվող գումարը</p>
            <input type="number" id="cashoutInput" class="option-input" value="500" min="500" />
            <button class="option-btn" onclick="customCashout()">Հանել նշված գումարը</button>
            <button class="option-btn" onclick="cashoutAll()">Հանել ԱՄԲՈՂՋԸ</button>
            <button class="close-modal" onclick="closeModal('cashoutModal')">Փակել</button>
        </div>
    </div>

    <script>
        const symbols = ['🍇', '🍉', '🍊', '🍑', '🍋', '🔔', '7️⃣', '☘️'];
        let balance = 1000;
        let currentBet = 20;
        let currentWin = 0;
        let isSpinning = false;

        // Web Audio API ձայների համար
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'spinTick') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300 + Math.random() * 100, now);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                } else if (type === 'win') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15);
                    osc.frequency.setValueAtTime(783.99, now + 0.3);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance + ' ֏';
            document.getElementById('winVal').innerText = currentWin + ' ֏';
        }

        function setBet(amount, btn) {
            if (isSpinning) return;
            playSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function startSpin() {
            if (isSpinning) return;
            initAudio();
            if (balance < currentBet) {
                alert('Բալանսը բավարար չէ խաղադրույքի համար։');
                return;
            }

            playSound('click');
            balance -= currentBet;
            currentWin = 0;
            updateUI();
            
            document.querySelectorAll('.reel-cell').forEach(c => c.classList.remove('winning'));

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerText = 'ՊՏՏՎՈՒՄ Է...';

            let cells = document.querySelectorAll('.reel-cell');
            
            let interval = setInterval(() => {
                cells.forEach(c => {
                    c.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                    playSound('spinTick');
                });
            }, 70);

            setTimeout(() => {
                clearInterval(interval);
                
                let finalSymbols = [];
                cells.forEach(c => {
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    c.innerText = sym;
                    finalSymbols.push(sym);
                });

                // Հաղթանակի ստուգում (միջին տող)
                if (finalSymbols[5] === finalSymbols[6] && finalSymbols[6] === finalSymbols[7]) {
                    currentWin = currentBet * 10;
                    balance += currentWin;
                    cells[5].classList.add('winning');
                    cells[6].classList.add('winning');
                    cells[7].classList.add('winning');
                    playSound('win');
                }

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = 'ՊՏՏԵԼ';
                updateUI();
            }, 1000);
        }

        function openModal(id) {
            playSound('click');
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            playSound('click');
            document.getElementById(id).style.display = 'none';
        }

        function topUpQuick(amount) {
            balance += amount;
            updateUI();
            closeModal('topUpModal');
            alert('Հաջողությամբ համալրվեց +' + amount + ' ֏');
        }

        function customTopUp() {
            let val = parseInt(document.getElementById('topUpInput').value);
            if (isNaN(val) || val < 100) {
                alert('Նվազագույն դեպոզիտը 100 ֏ է։');
                return;
            }
            balance += val;
            updateUI();
            closeModal('topUpModal');
            alert('Հաջողությամբ համալրվեց +' + val + ' ֏');
        }

        function customCashout() {
            let val = parseInt(document.getElementById('cashoutInput').value);
            if (isNaN(val) || val < 500) {
                alert('Նվազագույն կանխիկացումը 500 ֏ է։');
                return;
            }
            if (val > balance) {
                alert('Բալանսում այսքան գումար չկա։');
                return;
            }
            balance -= val;
            updateUI();
            closeModal('cashoutModal');
            alert('Հաջողությամբ կանխիկացվեց ' + val + ' ֏');
        }

        function cashoutAll() {
            if (balance < 500) {
                alert('Կանխիկացման նվազագույն գումարը 500 ֏ է։');
                return;
            }
            let amt = balance;
            balance = 0;
            updateUI();
            closeModal('cashoutModal');
            alert('Հաջողությամբ կանխիկացվեց ամբողջը՝ ' + amt + ' ֏');
        }

        updateUI();
    </script>
</body>
</html>
