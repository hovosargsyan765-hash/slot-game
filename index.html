<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning Hot PRO - Jackpot & Cashout</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #051c09;
            --panel-bg: #0b2e12;
            --gold: #f3c653;
            --gold-light: #ffea9f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f4019 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            overflow: hidden;
        }

        /* Jackpot Panel */
        .jackpot-panel {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(135deg, #113f1b, #071f0d);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        }

        .jp-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid #b8860b;
            border-radius: 6px;
            padding: 3px;
        }

        .jp-title {
            font-size: 10px;
            font-weight: bold;
        }

        .jp-val {
            font-size: 11px;
            color: var(--gold-light);
            font-weight: bold;
        }

        header {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 6px 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        }

        .balance-box, .win-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 8px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: bold;
        }

        .value {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
        }

        .top-up-btn, .cashout-btn {
            background: linear-gradient(135deg, #ffcc00, #ff8800);
            border: 1px solid #fff;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 153, 0, 0.6);
        }

        .cashout-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: #fff;
        }

        /* Slot Machine Area */
        .slot-container {
            position: relative;
            background: linear-gradient(180deg, #0d3815 0%, #030d05 100%);
            border: 3px solid var(--gold);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(243, 198, 83, 0.4), inset 0 0 15px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 360px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .reel-cell {
            background: radial-gradient(circle, #ffffff 0%, #dcdcdc 100%);
            border: 2px solid #b8860b;
            border-radius: 8px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
        }

        .reel-cell.winning {
            background: radial-gradient(circle, #ffffa3 0%, #ffcc00 100%);
            border-color: #ff3300;
            animation: pulseWin 0.4s infinite alternate;
        }

        @keyframes pulseWin {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Controls Panel */
        .controls-panel {
            width: 100%;
            max-width: 360px;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        }

        .bets-row {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .bet-btn {
            flex: 1;
            background: #113f1b;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 0;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
        }

        .action-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spin-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff3333, #880000);
            border: 3px solid var(--gold);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .spin-btn.stop-state {
            background: linear-gradient(145deg, #ff9900, #b35900);
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 300px;
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 15px;
        }

        .option-btn {
            background: #113f1b;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 8px;
            margin: 5px 0;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .option-btn:hover {
            background: var(--gold);
            color: #000;
        }

        .close-modal {
            margin-top: 10px;
            background: #555;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Jackpot Panel -->
    <div class="jackpot-panel">
        <div class="jp-box"><div class="jp-title" style="color: #b71c1c;">♠ SPADE</div><div class="jp-val" id="jpSpade">12,450 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #d32f2f;">♥ HEART</div><div class="jp-val" id="jpHeart">8,320 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #1976D2;">♦ DIAM</div><div class="jp-val" id="jpDiamond">5,100 ֏</div></div>
        <div class="jp-box"><div class="jp-title" style="color: #388E3C;">♣ CLUB</div><div class="jp-val" id="jpClub">2,900 ֏</div></div>
    </div>

    <header>
        <div class="balance-box">
            <span class="label">ԲԱԼԱՆՍ</span>
            <span class="value" id="balanceVal">1000 ֏</span>
        </div>
        <div class="win-box">
            <span class="label">ՇԱՀՈՒՄ</span>
            <span class="value" id="winVal">0 ֏</span>
        </div>
        <button class="top-up-btn" onclick="openModal('topUpModal')">⭐ ԴԵՊՈԶԻՏ</button>
        <button class="cashout-btn" onclick="openModal('cashoutModal')">💰 ՀԱՆԵԼ</button>
    </header>

    <div class="slot-container">
        <div class="grid-3x3" id="slotGrid">
            <div class="reel-cell">🍒</div>
            <div class="reel-cell">🍋</div>
            <div class="reel-cell">👑</div>
            <div class="reel-cell">🍉</div>
            <div class="reel-cell">⭐</div>
            <div class="reel-cell">🍇</div>
            <div class="reel-cell">🔔</div>
            <div class="reel-cell">🍊</div>
            <div class="reel-cell">👑</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="bets-row" id="betsRow">
            <button class="bet-btn active" onclick="setBet(10)">10</button>
            <button class="bet-btn" onclick="setBet(20)">20</button>
            <button class="bet-btn" onclick="setBet(30)">30</button>
            <button class="bet-btn" onclick="setBet(40)">40</button>
            <button class="bet-btn" onclick="setBet(50)">50</button>
        </div>
        <div class="action-row">
            <button class="spin-btn" id="spinBtn" onclick="handleSpinAction()">ՊՏՏԵԼ</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="topUpModal">
        <div class="modal-content">
            <h3>ԴԵՊՈԶԻՏ (ՀԱՄԱԼՐՈՒՄ)</h3>
            <button class="option-btn" onclick="topUp(500, 50)">⭐ 50 Stars (+500 ֏)</button>
            <button class="option-btn" onclick="topUp(1200, 100)">⭐ 100 Stars (+1200 ֏)</button>
            <button class="option-btn" onclick="topUp(3000, 250)">⭐ 250 Stars (+3000 ֏)</button>
            <button class="close-modal" onclick="closeModal('topUpModal')">Փակել</button>
        </div>
    </div>

    <!-- Cashout Modal -->
    <div class="modal" id="cashoutModal">
        <div class="modal-content">
            <h3>ԿԱՆԽԻԿԱՑՈՒՄ (ՀԱՆՈՒՄ)</h3>
            <p style="font-size: 11px; margin-bottom: 10px; color: #ddd;">Ընտրեք կանխիկացման եղանակը</p>
            <button class="option-btn" onclick="processCashout('Telegram Stars')">⭐ Փոխանցել Telegram Stars-ին</button>
            <button class="option-btn" onclick="processCashout('Bank Card')">💳 Բանկային քարտին (Armenian Card)</button>
            <button class="close-modal" onclick="closeModal('cashoutModal')">Փակել</button>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🍉', '🔔', '⭐', '👑'];
        const weights = [30, 25, 20, 15, 8, 5, 3, 2];

        let balance = 1000;
        let currentBet = 10;
        let currentWin = 0;
        let isSpinning = false;
        let spinInterval = null;

        // Jackpots auto-increment simulation
        let jpValues = { spade: 12450, heart: 8320, diamond: 5100, club: 2900 };
        setInterval(() => {
            jpValues.spade += Math.floor(Math.random() * 5);
            jpValues.heart += Math.floor(Math.random() * 4);
            jpValues.diamond += Math.floor(Math.random() * 3);
            jpValues.club += Math.floor(Math.random() * 2);
            document.getElementById('jpSpade').innerText = jpValues.spade.toLocaleString() + ' ֏';
            document.getElementById('jpHeart').innerText = jpValues.heart.toLocaleString() + ' ֏';
            document.getElementById('jpDiamond').innerText = jpValues.diamond.toLocaleString() + ' ֏';
            document.getElementById('jpClub').innerText = jpValues.club.toLocaleString() + ' ֏';
        }, 2000);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.start(); osc.stop(audioCtx.currentTime + 0.03);
            } else if (type === 'spinTick') {
                osc.frequency.setValueAtTime(200 + Math.random() * 100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function getRandomSymbol() {
            let totalWeight = weights.reduce((a, b) => a + b, 0);
            let randomNum = Math.random() * totalWeight;
            for (let i = 0; i < symbols.length; i++) {
                if (randomNum < weights[i]) return symbols[i];
                randomNum -= weights[i];
            }
            return symbols[0];
        }

        function setBet(amount) {
            if (isSpinning) return;
            playSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === amount);
            });
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance.toLocaleString() + ' ֏';
            document.getElementById('winVal').innerText = currentWin.toLocaleString() + ' ֏';
        }

        function handleSpinAction() {
            playSound('click');
            const spinBtn = document.getElementById('spinBtn');

            if (!isSpinning) {
                if (balance < currentBet) {
                    alert('Բալանսը բավարար չէ։ Սեղմեք ԴԵՊՈԶԻՏ կոճակը։');
                    return;
                }

                balance -= currentBet;
                currentWin = 0;
                updateUI();
                clearWinningCells();

                isSpinning = true;
                spinBtn.innerText = 'ԿԱՆԳՆԵԼ';
                spinBtn.classList.add('stop-state');

                const cells = document.querySelectorAll('.reel-cell');
                spinInterval = setInterval(() => {
                    cells.forEach(cell => {
                        cell.innerText = getRandomSymbol();
                        playSound('spinTick');
                    });
                }, 70);

            } else {
                stopSpinAndEvaluate();
            }
        }

        function stopSpinAndEvaluate() {
            if (!isSpinning) return;
            clearInterval(spinInterval);
            isSpinning = false;
            
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = 'ՊՏՏԵԼ';
            spinBtn.classList.remove('stop-state');

            const cells = document.querySelectorAll('.reel-cell');
            let matrix = [];
            cells.forEach(cell => {
                let sym = getRandomSymbol();
                cell.innerText = sym;
                matrix.push(sym);
            });

            let winAmount = 0;
            let winningIndices = [];

            // Middle row evaluation with Crown Wild
            let m1 = matrix[3], m2 = matrix[4], m3 = matrix[5];
            if ((m1 === m2 && m2 === m3) || m1 === '👑' || m2 === '👑' || m3 === '👑') {
                winAmount += currentBet * 10;
                winningIndices.push(3, 4, 5);
            }

            // Top & Bottom rows
            if (matrix[0] === matrix[1] && matrix[1] === matrix[2]) {
                winAmount += currentBet * 5;
                winningIndices.push(0, 1, 2);
            }
            if (matrix[6] === matrix[7] && matrix[7] === matrix[8]) {
                winAmount += currentBet * 5;
                winningIndices.push(6, 7, 8);
            }

            if (winAmount > 0) {
                currentWin = winAmount;
                balance += winAmount;
                playSound('win');
                winningIndices.forEach(idx => cells[idx].classList.add('winning'));
            }

            updateUI();
        }

        function clearWinningCells() {
            document.querySelectorAll('.reel-cell').forEach(cell => cell.classList.remove('winning'));
        }

        function openModal(id) { playSound('click'); document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { playSound('click'); document.getElementById(id).style.display = 'none'; }

        function topUp(amount, stars) {
            balance += amount;
            updateUI();
            closeModal('topUpModal');
            alert(`Հաջողությամբ համալրվեց +${amount} ֏ (${stars} Stars)!`);
        }

        function processCashout(method) {
            if (balance <= 0) {
                alert('Կանխիկացման համար բալանսը դատարկ է։');
                return;
            }
            let amountToCashout = balance;
            balance = 0;
            updateUI();
            closeModal('cashoutModal');
            alert(`Հաջողությամբ կանխիկացվեց ${amountToCashout} ֏ (${method} միջոցով)։`);
        }

        updateUI();
    </script>
</body>
</html>
