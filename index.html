<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burning Hot Pro - Telegram Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #071f0d;
            --panel-bg: #0b3114;
            --gold: #f3c653;
            --gold-light: #ffea9f;
            --accent-red: #d32f2f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #11421b 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 8px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .balance-box, .win-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 10px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
        }

        .top-up-btn {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 153, 0, 0.5);
            transition: transform 0.1s;
        }

        .top-up-btn:active {
            transform: scale(0.9);
        }

        /* Slot Machine Area */
        .slot-container {
            position: relative;
            background: linear-gradient(180deg, #0d3815 0%, #051408 100%);
            border: 4px solid var(--gold);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(243, 198, 83, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 340px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .reel-cell {
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
            border: 2px solid #b8860b;
            border-radius: 10px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .reel-cell.winning {
            background: radial-gradient(circle, #ffffa3 0%, #ffcc00 100%);
            border-color: #ff3300;
            animation: pulseWin 0.5s infinite alternate;
        }

        @keyframes pulseWin {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Controls Panel */
        .controls-panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .bets-row {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }

        .bet-btn {
            flex: 1;
            background: #113f1b;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bet-btn.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 10px var(--gold);
        }

        /* Round Spin Button */
        .action-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spin-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff3333, #990000);
            border: 4px solid var(--gold);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
            outline: none;
        }

        .spin-btn:active {
            transform: scale(0.92);
        }

        .spin-btn.stop-state {
            background: linear-gradient(145deg, #ff9900, #cc6600);
        }

        /* Modal TopUp */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 300px;
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 12px;
        }

        .star-option {
            background: #113f1b;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .star-option:hover {
            background: var(--gold);
            color: #000;
        }

        .close-modal {
            margin-top: 10px;
            background: #666;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <span class="label">ԲԱԼԱՆՍ</span>
            <span class="value" id="balanceVal">1000 ֏</span>
        </div>
        <div class="win-box">
            <span class="label">ՇԱՀՈՒՄ</span>
            <span class="value" id="winVal">0 ֏</span>
        </div>
        <button class="top-up-btn" onclick="openModal()">⭐</button>
    </header>

    <div class="slot-container">
        <div class="grid-3x3" id="slotGrid">
            <!-- 9 cells -->
            <div class="reel-cell">🍒</div>
            <div class="reel-cell">🍋</div>
            <div class="reel-cell">👑</div>
            <div class="reel-cell">🍉</div>
            <div class="reel-cell">⭐</div>
            <div class="reel-cell">🍇</div>
            <div class="reel-cell">🔔</div>
            <div class="reel-cell">🍊</div>
            <div class="reel-cell">🍒</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="bets-row" id="betsRow">
            <button class="bet-btn active" onclick="setBet(10)">10</button>
            <button class="bet-btn" onclick="setBet(20)">20</button>
            <button class="bet-btn" onclick="setBet(30)">30</button>
            <button class="bet-btn" onclick="setBet(40)">40</button>
            <button class="bet-btn" onclick="setBet(50)">50</button>
        </div>
        <div class="action-row">
            <button class="spin-btn" id="spinBtn" onclick="handleSpinAction()">ՊՏՏԵԼ</button>
        </div>
    </div>

    <!-- Modal for Telegram Stars TopUp -->
    <div class="modal" id="topUpModal">
        <div class="modal-content">
            <h3>ՀԱՇՎԵԿՇՌԻ ՀԱՄԱԼՐՈՒՄ</h3>
            <p style="font-size: 12px; margin-bottom: 10px; color: #ccc;">Ընտրեք Telegram Stars փաթեթը</p>
            <button class="star-option" onclick="topUp(500, 50)">⭐ 50 Stars (+500 ֏)</button>
            <button class="star-option" onclick="topUp(1200, 100)">⭐ 100 Stars (+1200 ֏)</button>
            <button class="star-option" onclick="topUp(3000, 250)">⭐ 250 Stars (+3000 ֏)</button>
            <button class="close-modal" onclick="closeModal()">Փակել</button>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🍉', '🔔', '⭐', '👑'];
        // Weights for Burning Hot feel (Crown and Star are rarer)
        const weights = [30, 25, 20, 15, 8, 5, 3, 2];

        let balance = 1000;
        let currentBet = 10;
        let currentWin = 0;
        let isSpinning = false;
        let spinInterval = null;

        // Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'spinTick') {
                osc.frequency.setValueAtTime(300 + Math.random() * 200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function getRandomSymbol() {
            let totalWeight = weights.reduce((a, b) => a + b, 0);
            let randomNum = Math.random() * totalWeight;
            for (let i = 0; i < symbols.length; i++) {
                if (randomNum < weights[i]) return symbols[i];
                randomNum -= weights[i];
            }
            return symbols[0];
        }

        function setBet(amount) {
            if (isSpinning) return;
            playSound('click');
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === amount);
            });
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = balance + ' ֏';
            document.getElementById('winVal').innerText = currentWin + ' ֏';
        }

        function handleSpinAction() {
            playSound('click');
            const spinBtn = document.getElementById('spinBtn');

            if (!isSpinning) {
                if (balance < currentBet) {
                    alert('Բալանսը բավարար չէ։ Համալրեք հաշիվը ⭐ կոճակով։');
                    return;
                }

                balance -= currentBet;
                currentWin = 0;
                updateUI();
                clearWinningCells();

                isSpinning = true;
                spinBtn.innerText = 'ԿԱՆԳՆԵԼ';
                spinBtn.classList.add('stop-state');

                const cells = document.querySelectorAll('.reel-cell');
                spinInterval = setInterval(() => {
                    cells.forEach(cell => {
                        cell.innerText = getRandomSymbol();
                        playSound('spinTick');
                    });
                }, 90);

            } else {
                stopSpinAndEvaluate();
            }
        }

        function stopSpinAndEvaluate() {
            clearInterval(spinInterval);
            isSpinning, isSpinning = false;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = 'ՊՏՏԵԼ';
            spinBtn.classList.remove('stop-state');

            const cells = document.querySelectorAll('.reel-cell');
            let matrix = [];
            cells.forEach(cell => {
                let sym = getRandomSymbol();
                cell.innerText = sym;
                matrix.push(sym);
            });

            // Evaluation logic with multipliers
            let winAmount = 0;
            let winningIndices = [];

            // 1. Check middle row (Index 3, 4, 5) -> 2x Multiplier
            if (matrix[3] === matrix[4] && matrix[4] === matrix[5] || matrix[3] === '👑' || matrix[4] === '👑') {
                winAmount += currentBet * 4 * 2; // 2x middle row win bonus
                winningIndices.push(3, 4, 5);
            }

            // 2. Check full field grid (all 9 items match or wild crown domination) -> 5x Multiplier
            let firstSym = matrix[0];
            let allMatch = matrix.every(s => s === firstSym || s === '👑');
            if (allMatch) {
                winAmount += currentBet * 20 * 5; // 5x full field win bonus
                winningIndices = [0,1,2,3,4,5,6,7,8];
            } else if (matrix[0] === matrix[1] && matrix[1] === matrix[2]) {
                winAmount += currentBet * 3;
                winningIndices.push(0, 1, 2);
            } else if (matrix[6] === matrix[7] && matrix[7] === matrix[8]) {
                winAmount += currentBet * 3;
                winningIndices.push(6, 7, 8);
            }

            if (winAmount > 0) {
                currentWin = winAmount;
                balance += winAmount;
                playSound('win');
                winningIndices.forEach(idx => {
                    cells[idx].classList.add('winning');
                });
            }

            updateUI();
        }

        function clearWinningCells() {
            document.querySelectorAll('.reel-cell').forEach(cell => {
                cell.classList.remove('winning');
            });
        }

        function openModal() {
            playSound('click');
            document.getElementById('topUpModal').style.display = 'flex';
        }

        function closeModal() {
            playSound('click');
            document.getElementById('topUpModal').style.display = 'none';
        }

        function topUp(amount, stars) {
            playSound('win');
            balance += amount;
            updateUI();
            closeModal();
            alert(`Հաջողությամբ համալրվեց +${amount} ֏ (${stars} Stars)!`);
        }

        updateUI();
    </script>
</body>
</html>
